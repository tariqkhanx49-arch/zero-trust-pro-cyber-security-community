<!doctype html>

<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>
        {% block title %}
        Zero Trust Pro
        {% endblock %}
    </title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <aside>

        <div class="brand">

            <span class="logo">
                ZT
            </span>

            <div>

                <b>
                    ZERO TRUST PRO
                </b>

                <small>
                    Cyber Security Community
                </small>

            </div>

        </div>

        <nav>

            <a href="/dashboard">
                ▦ Dashboard
            </a>

            <a href="/dashboard">
                ◫ My Learning
            </a>

            <a href="/profile">
                ◎ Profile
            </a>

        </nav>

        <div class="secure">

            ● Secure Portal

            <br>

            <small>
                Local student access
            </small>

        </div>

        <a class="logout" href="/logout">
            ↪ Sign out
        </a>

    </aside>

    <main>

        <header>

            <span>
                ZERO TRUST PRO
            </span>

            <div>

                ● Learning Portal　

                <a href="/profile">
                    T
                </a>

            </div>

        </header>

        <section class="content">

            {% with m=get_flashed_messages() %}

                {% for x in m %}

                    <div class="flash">
                        {{x}}
                    </div>

                {% endfor %}

            {% endwith %}

            {% block content %}

            {% endblock %}

        </section>

    </main>

</body>

</html>
