<!doctype html>

<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Zero Trust Pro</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="login">

    <div class="loginbox">

        <div class="logo">ZT</div>

        <b>ZERO TRUST PRO</b>

        <small>Cyber Security Community</small>

        <div class="card">

            <label>STUDENT PORTAL</label>

            <h1>Welcome back, Tariq.</h1>

            <p>Sign in to continue your cybersecurity learning journey.</p>

            {% with m=get_flashed_messages() %}

                {% for x in m %}

                    <div class="error">{{x}}</div>

                {% endfor %}

            {% endwith %}

            <form method="post" action="/login">

                <input name="username" value="Tariq" required>

                <input name="password" type="password" placeholder="Password" required>

                <button>Sign in to portal →</button>

            </form>

            <small>Protected learning environment</small>

        </div>

    </div>

</body>

</html>
